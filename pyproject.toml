[project]
name = "handy-context"
version = "0.1.0"
description = "Deep Context and a personal dictionary for Handy dictation"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["uiautomation==2.0.29; sys_platform == 'win32'"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["handy_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
